version: 0.2


env:
  variables:
    AWS_DEFAULT_REGION: "eu-central-1"
    ECR_REPO_NAME     : "webapp"
    ECR_IMAGE_TAG     : "latest"
phases:
  pre_build:
  commands:
    - set -e
    - echo "AWS CLI:"; aws --version
    - echo "Docker:"; docker --version
    - echo "Caller identity:"; aws sts get-caller-identity
    - echo "Region=$AWS_DEFAULT_REGION  AccountVar=$AWS_ACCOUNT_ID"
    - echo "Check ECR API доступность (describe-registry):"
    - aws ecr describe-registry --region "$AWS_DEFAULT_REGION"

    # Логин (без утечки пароля в лог)
    - PASS=$(aws ecr get-login-password --region "$AWS_DEFAULT_REGION")
    - echo "$PASS" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
  build:
    commands:
      - echo "Build Docker image..."
      - docker build -t $ECR_REPO_NAME:$ECR_IMAGE_TAG .
      - docker tag $ECR_REPO_NAME:$ECR_IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME:$ECR_IMAGE_TAG
      - docker tag $ECR_REPO_NAME:$ECR_IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME:$COMMIT_ID

  post_build:
    commands:
      - echo "Push to ECR"
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME:$ECR_IMAGE_TAG
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME:$COMMIT_ID
      - printf '[{"name":"nginx","imageUri":"%s"}]' $ECR_REPO_NAME:$ECR_IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
