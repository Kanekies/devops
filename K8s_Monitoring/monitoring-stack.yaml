apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 82.4.3
    helm:
      releaseName: monitoring
      values: |
        grafana:
          adminPassword: admin

        # чтобы не зависать на admission hooks/jobs
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false

        prometheus:
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['namespace','alertname']
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 1h
              receiver: demo-webhook
              routes:
                - receiver: 'null'
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: 'null'
              - name: demo-webhook
                webhook_configs:
                  - url: "http://demo-app.demo.svc.cluster.local/"
                    send_resolved: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
